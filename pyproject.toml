[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vonet"
version = "0.1.0"
description = "PyTorch reproduction of VoNet for vehicle orientation classification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "packaging>=24.0",
    "pillow>=10.0",
    "safetensors>=0.4",
    "setuptools>=82.0.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
]

[project.scripts]
vonet-train = "vonet.train:main"
vonet-benchmark = "vonet.benchmark:main"
vonet-export-hf = "vonet.export_hf:main"
vonet-infer = "vonet.infer:main"

[tool.setuptools.packages.find]
include = ["vonet*"]
